name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  # The group name ensures that previous jobs are cancelled when pushing to
  # pull requets. While pushing to a branch does not cancel previous jobs.
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

env:
  WP_TESTS_DIR: /tmp/wordpress-tests-lib

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }} / WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2']
        wp: ['latest']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The creo theme is a private submodule. CREO_WP_TOKEN is a token
          # with read access to akselkvitberg/creo-wp-fork.
          submodules: true
          token: ${{ secrets.CREO_WP_TOKEN }}

      - name: Setup Node.js and build assets
        uses: ./.github/actions/setup-node
        with:
          build: true

      - name: Setup PHP
        uses: ./.github/actions/setup-php
        with:
          php-version: ${{ matrix.php }}

      - name: Setup WordPress
        id: setup-wp
        uses: ./.github/actions/setup-wp
        with:
          wp-version: ${{ matrix.wp }}

      - name: Setup problem matchers for PHPUnit
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Download tests
        run: |
          mkdir -p $WP_TESTS_DIR
          svn co --quiet https://develop.svn.wordpress.org/${{ steps.setup-wp.outputs.tag-name }}/tests/phpunit/includes/ $WP_TESTS_DIR/includes
          svn co --quiet https://develop.svn.wordpress.org/${{ steps.setup-wp.outputs.tag-name }}/tests/phpunit/data/ $WP_TESTS_DIR/data

      - name: Setup wp-tests-config.php
        run: |
          curl -s https://develop.svn.wordpress.org/${{ steps.setup-wp.outputs.tag-name }}/wp-tests-config-sample.php > $WP_TESTS_DIR/wp-tests-config.php
          sed -i "s:dirname( __FILE__ ) . '/src/':'/tmp/wordpress/':" $WP_TESTS_DIR/wp-tests-config.php
          sed -i "s/youremptytestdbnamehere/wordpress/" $WP_TESTS_DIR/wp-tests-config.php
          sed -i "s/yourusernamehere/root/" $WP_TESTS_DIR/wp-tests-config.php
          sed -i "s/yourpasswordhere/root/" $WP_TESTS_DIR/wp-tests-config.php
          sed -i "s|localhost|127.0.0.1|" $WP_TESTS_DIR/wp-tests-config.php

      - name: Run the tests
        run: ./vendor/bin/phpunit

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.CREO_WP_TOKEN }}

      - name: Setup Node.js and build assets
        uses: ./.github/actions/setup-node
        with:
          build: true

      - name: Setup PHP
        uses: ./.github/actions/setup-php

      - name: Start MySQL
        run: |
          sudo systemctl start mysql
          while ! mysqladmin ping -h 127.0.0.1 --silent; do sleep 1; done

      - name: Start WordPress with example data
        run: bin/php-server.sh
        env:
          DB_PASSWORD: root

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm test:e2e
        env:
          E2E_RESET_COMMAND: vendor/bin/wp --path=.tmp/wordpress creo-rombooking seed --reset

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            .tmp/php-server.log
            .tmp/wordpress/wp-content/debug.log
