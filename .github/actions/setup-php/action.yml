inputs:
  php-version:
    default: '8.2'

runs:
  using: composite
  steps:
    - name: Setup env variables
      shell: bash
      run: |
        echo "WP_CLI_CACHE_DIR=$GITHUB_WORKSPACE/.cache/wp-cli" >> $GITHUB_ENV
        echo "WP_CLI_PACKAGES_DIR=$GITHUB_WORKSPACE/.cache/wp-cli/packages" >> $GITHUB_ENV

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        coverage: none
        tools: composer,cs2pr

    - name: Get Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Setup Composer cache
      uses: actions/cache@v3
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-php-${{ inputs.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-php-${{ inputs.php-version }}-composer-

    - name: Setup WP-CLI cache
      uses: actions/cache@v3
      with:
        path: $GITHUB_WORKSPACE/.cache/wp-cli
        key: ${{ runner.os }}-php-${{ inputs.php-version }}-wp-cli-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-php-${{ inputs.php-version }}-composer-

    - name: Install Composer dependencies
      shell: bash
      run: composer install --no-suggest
